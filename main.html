<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMDb Movie Page</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .moviePic {
      height: 400px;
      width: 270px;
      opacity: 0.9;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    .movieDetail {
      position: relative;
      top: 20px;
      width: 70%;
      margin: 0 auto;
      text-align: center;
      font-size: 18px;
      line-height: 1.6;
      color: #ddd;
    }
  </style>
</head>

<body>

  <h1>Inception</h1>

  <img
    class="moviePic"
    src="https://m.media-amazon.com/images/I/81p+xe8cbnL._AC_UF1000,1000_QL80_.jpg"
    alt="Inception Movie Poster"
  >

  <p class="movieDetail">
    Inception is a science-fiction thriller directed by Christopher Nolan.
    The story follows a skilled thief who enters the dreams of others to
    steal valuable secrets and is given a seemingly impossible task that
    could change his life forever.
  </p>

</body>
</html>
